<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff6f8">
<title>Theju's Little Recovery Corner ♥</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="petals" aria-hidden="true"></div>

<main class="app">
  <div class="progress"><span id="progressBar"></span></div>

  <section class="screen active" data-index="0" id="s0">
    <img src="assets/01-welcome.jpg" alt="Theju's Little Recovery Corner">
    <button class="hotspot main" data-next="1" aria-label="Let's begin"></button>
  </section>

  <section class="screen" data-index="1" id="s1">
    <img src="assets/02-rest.jpg" alt="Hey Theju">
    <button class="hotspot main" data-next="2" aria-label="Show me more"></button>
  </section>

  <section class="screen" data-index="2" id="s2">
    <img src="assets/03-prescription.jpg" alt="Your daily prescription">
    <button class="hotspot main" id="dose" aria-label="Give me another dose"></button>
    <button class="hotspot secondary" data-next="3" aria-label="I'm feeling better"></button>
    <div class="toast" id="doseToast"></div>
  </section>

  <section class="screen game-screen" data-index="3" id="s3">
    <img src="assets/04-game.jpg" alt="Catch the Hearts">
    <div class="game-layer" id="gameLayer"></div>
    <div class="game-hud"><span>TIME <b id="time">20</b></span><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div>
    <button class="game-start" id="play">Start game →</button>
    <p class="game-help">Tap the hearts before they disappear!</p>
  </section>

  <section class="screen" data-index="4" id="s4">
    <img src="assets/05-result.jpg" alt="You caught the hearts">
    <button class="hotspot main" data-next="5" aria-label="What's next"></button>
  </section>

  <section class="screen" data-index="5" id="s5">
    <img src="assets/06-company.jpg" alt="If I were there right now">
    <button class="hotspot main" data-next="6" aria-label="That's so sweet"></button>
  </section>

  <section class="screen" data-index="6" id="s6">
    <img src="assets/07-smile.jpg" alt="Need a little smile">
    <div class="card-hotspots">
      <button data-msg="You're stronger than this little fever. 🌸"></button>
      <button data-msg="Coughs are temporary, but your smile is permanent. ♥"></button>
      <button data-msg="You're doing your best. That's enough. ☀️"></button>
      <button data-msg="No overthinking. Doctor's orders. 😌"></button>
      <button data-msg="Your rest today is a brighter you tomorrow. 🍃"></button>
      <button data-msg="Proud of you for taking care of yourself. 🫶"></button>
    </div>
    <div class="message-pop" id="messagePop"></div>
    <button class="hotspot main hidden" id="nightNext" data-next="7" aria-label="One last thing"></button>
  </section>

  <section class="screen" data-index="7" id="s7">
    <img src="assets/08-night.jpg" alt="Now put the phone down">
    <button class="hotspot main" data-next="8" aria-label="Okay I'll rest"></button>
  </section>

  <section class="screen" data-index="8" id="s8">
    <img src="assets/09-good.jpg" alt="Good girl">
    <button class="hotspot main" data-next="9" aria-label="Rest today"></button>
  </section>

  <section class="screen" data-index="9" id="s9">
    <img src="assets/10-final.jpg" alt="Thank you for visiting my little corner">
    <button class="restart" id="restart">Come back anytime ♡</button>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
